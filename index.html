<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Computer Technology Trade</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Chakra+Petch:wght@500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: sticky top bar; full-bleed dark "network rack" hero on the splash; one 1080px content column; list-first pages built for quick scanning */
:root{
  --bg:#eef2f6; --surface:#ffffff; --surface-2:#f4f7fa; --ink:#0d1726; --muted:#55657c; --line:#d5dde8;
  --accent:#0a7387; --accent-ink:#ffffff; --accent-soft:#dcf0f4;
  --good:#17804a; --good-soft:#e0f3e7; --bad:#b8363b; --bad-soft:#f9e3e3; --warn:#9a6200; --warn-soft:#fbefd8;
  --hero-bg:#0a1322; --hero-ink:#e8eef8; --hero-muted:#9fb1c9; --hero-line:#3cc4d8; --led:#36d47c; --led-amber:#f2b53a;
  --display:"Chakra Petch","Segoe UI",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible","Segoe UI",system-ui,-apple-system,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,"Courier New",monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0a111d; --surface:#111b2b; --surface-2:#15213a; --ink:#e4ebf5; --muted:#94a3b9; --line:#25344b;
  --accent:#3cc4d8; --accent-ink:#04141a; --accent-soft:#0f2f3a;
  --good:#3ccf7f; --good-soft:#0f2e20; --bad:#ff7070; --bad-soft:#3a1618; --warn:#f0b44a; --warn-soft:#352612;
  --hero-bg:#060c17; --hero-ink:#e8eef8; --hero-muted:#9fb1c9; --hero-line:#3cc4d8; --led:#36d47c; --led-amber:#f2b53a;
  color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0a111d; --surface:#111b2b; --surface-2:#15213a; --ink:#e4ebf5; --muted:#94a3b9; --line:#25344b;
  --accent:#3cc4d8; --accent-ink:#04141a; --accent-soft:#0f2f3a;
  --good:#3ccf7f; --good-soft:#0f2e20; --bad:#ff7070; --bad-soft:#3a1618; --warn:#f0b44a; --warn-soft:#352612;
  --hero-bg:#060c17; --hero-ink:#e8eef8; --hero-muted:#9fb1c9; --hero-line:#3cc4d8; --led:#36d47c; --led-amber:#f2b53a;
  color-scheme:dark;}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:4px}
h1,h2,h3{font-family:var(--display);line-height:1.15;text-wrap:balance;margin:0}
p{margin:0}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mono{font-family:var(--mono)}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.topbar .wrap{display:flex;align-items:center;gap:12px 20px;flex-wrap:wrap;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);font-family:var(--display);font-weight:700;font-size:17px;letter-spacing:.02em;margin-right:auto}
.brand svg{flex:none}
.nav{display:flex;gap:4px;flex-wrap:wrap}
.nav a{font-family:var(--display);font-weight:600;font-size:15px;text-decoration:none;color:var(--muted);padding:7px 11px;border-radius:8px}
.nav a:hover{color:var(--ink);background:var(--surface-2)}
.nav a[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}
body.exam-mode .nav{display:none}
/* Graded/emailed tests run in exam-mode: bright-yellow background so an in-progress
   emailed test (graded sub-unit test, unit exam, or full practice exam) is obvious at a glance.
   Question cards keep their own surface color, so text stays readable in light and dark themes. */
body.exam-mode{background:#ffe600}
body.exam-mode::before{background:#ffe600}
/* Non-graded practice sets run in practice-mode: bright-blue background so an in-progress
   practice test (nothing emailed) is just as easy to spot as a graded one.
   Question cards keep their own surface color, so text stays readable in light and dark themes. */
body.practice-mode{background:#1e90ff}
body.practice-mode::before{background:#1e90ff}
/* Congratulations banner + confetti shown when a graded test is passed */
.celebrate{display:flex;gap:14px;align-items:center;background:linear-gradient(90deg,#e0f3e7,#eafff3);border:1px solid var(--good);border-radius:14px;padding:14px 18px;margin-bottom:18px;animation:celebpop .5s ease}
.celebrate-emoji{font-size:34px;line-height:1}
.celebrate-title{font-weight:800;font-size:18px;color:#13794a}
.celebrate-sub{color:#2a6a4c;font-size:14px;margin-top:2px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .celebrate{background:rgba(23,128,74,.18)} :root:not([data-theme="light"]) .celebrate-title{color:#7ff0b4} :root:not([data-theme="light"]) .celebrate-sub{color:#b7e8cd}}
:root[data-theme="dark"] .celebrate{background:rgba(23,128,74,.18)}:root[data-theme="dark"] .celebrate-title{color:#7ff0b4}:root[data-theme="dark"] .celebrate-sub{color:#b7e8cd}
@keyframes celebpop{0%{transform:scale(.96);opacity:0}100%{transform:scale(1);opacity:1}}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:9999}
/* Student accounts: nav auth, My Progress, identity banner */
#navAuth{display:inline-flex;gap:4px;align-items:center;margin-left:6px}
#navAuth a{font-family:var(--display);font-weight:600;font-size:15px;text-decoration:none;color:var(--muted);padding:7px 11px;border-radius:8px}
#navAuth a:hover{color:var(--ink);background:var(--surface-2)}
#navAuth a[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}
.pstats{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:22px}
.statbox{display:flex;flex-direction:column;gap:2px;padding:14px 18px;background:var(--surface);border:1px solid var(--line);border-radius:14px;min-width:150px}
.snum{font-size:26px;font-weight:800}.snum small{font-size:15px;color:var(--muted);font-weight:600}
.slab{color:var(--muted);font-size:13px}
.prow{display:grid;grid-template-columns:220px 1fr 130px;gap:14px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.prow:last-child{border-bottom:none}
.pmeta b{display:block}.pmeta span{color:var(--muted);font-size:13px}
.pbar{height:10px;background:var(--surface-2);border-radius:6px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--accent)}
.pnum{text-align:right}.pnum b{font-size:18px}.pnum span{color:var(--muted);font-size:13px;margin-left:3px}
.idbanner{background:var(--accent-soft);color:var(--ink);border-radius:10px;padding:10px 14px;font-size:14px;margin-bottom:4px}
.idbanner span{color:var(--muted)}
@media (max-width:640px){.prow{grid-template-columns:104px 1fr 84px}}
/* Instructor dashboard */
.hide{display:none}
.ds-tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:4px 0 20px}
.ds-tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.ds-tile .k{font-size:12px;text-transform:uppercase;letter-spacing:.3px;color:var(--muted)}
.ds-tile .v{font-size:26px;font-weight:800;margin-top:3px}.ds-tile .v small{font-size:14px;color:var(--muted);font-weight:600}
.ds-tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.ds-tab{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 15px;border-radius:999px;font-weight:600;font-size:14px;cursor:pointer;font-family:inherit}
.ds-tab[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.ds-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.ds-table{width:100%;border-collapse:collapse;font-size:14px}
.ds-table th{text-align:left;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.3px;padding:11px 12px;border-bottom:1px solid var(--line)}
.ds-table td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.ds-table tr:last-child td{border-bottom:none}
.ds-name{font-weight:700}.ds-id{color:var(--muted);font-size:12px}.ds-mini{color:var(--muted);font-size:13px}
.ds-pill{display:inline-block;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:700}
.ds-pill.good{background:var(--good-soft);color:var(--good)}.ds-pill.mid{background:var(--warn-soft);color:var(--warn)}.ds-pill.low{background:var(--bad-soft);color:var(--bad)}
.ds-ubars{display:flex;gap:4px;align-items:flex-end;height:32px}
.ds-ubar{width:14px;background:var(--surface-2);border-radius:3px 3px 0 0;height:30px;display:inline-flex;align-items:flex-end}
.ds-ubar i{display:block;width:100%;background:var(--accent);border-radius:3px 3px 0 0}
.ds-lead-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.ds-lead{display:flex;align-items:center;gap:12px;padding:8px 2px;border-bottom:1px solid var(--line)}
.ds-lead:last-child{border-bottom:none}
.ds-rank{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:13px;background:var(--surface-2);color:var(--muted)}
.ds-rank.g1{background:#ffedb0;color:#8a6d1b}.ds-rank.g2{background:#e4e8ee;color:#5b6676}.ds-rank.g3{background:#f3dcc4;color:#8a5a2b}
.ds-sel{padding:9px 12px;border:1px solid var(--line);border-radius:10px;font-size:14px;background:var(--surface);color:var(--ink);margin-top:4px}
.ds-dstats{display:flex;gap:26px;flex-wrap:wrap}
.ds-urow{display:grid;grid-template-columns:120px 1fr 90px;gap:12px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.ds-urow:last-child{border-bottom:none}
.ds-bar{height:9px;background:var(--surface-2);border-radius:6px;overflow:hidden}.ds-bar i{display:block;height:100%;background:var(--accent)}
.ds-att{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px}
.ds-att:last-child{border-bottom:none}
.pw-row{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.pw-row label{width:92px;font-weight:600;flex:none;color:var(--ink)}
.pw-input{font-family:'Courier New',monospace;font-weight:700;flex:1}
@media (max-width:720px){.ds-tiles{grid-template-columns:repeat(2,1fr)}.ds-lead-grid{grid-template-columns:1fr}}
/* Dashboard: export + struggling flag */
.ds-toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.ds-toolbar .sp{margin-left:auto}
.ds-alert{display:flex;align-items:flex-start;gap:10px;padding:11px 14px;border-radius:12px;border:1px solid var(--line);font-size:14px;margin-bottom:12px;line-height:1.45}
.ds-alert.warn{background:var(--bad-soft);border-color:var(--bad)}
.ds-alert.ok{background:var(--good-soft);border-color:var(--good)}
.ds-alert span{font-size:16px;line-height:1.3;flex:none}
.ds-flag{display:inline-block;margin-top:4px;font-size:11px;font-weight:700;color:var(--bad);background:var(--bad-soft);padding:2px 8px;border-radius:999px}
.ds-flag.ns{color:var(--muted);background:var(--surface-2)}
.ds-table tr.flagged td{background:var(--bad-soft)}
.chk{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--ink);cursor:pointer}
.chk input{width:16px;height:16px;accent-color:var(--accent)}
/* Pre-test rules + acknowledgment */
.examrules{background:var(--warn-soft);border:1px solid var(--warn);border-radius:14px;padding:16px 18px 14px;margin:0 0 16px}
.examrules h2{margin:0 0 8px;font-size:17px;color:var(--ink)}
.examrules ol{margin:0;padding-left:22px}
.examrules li{margin-bottom:7px;font-size:14px;line-height:1.5;color:var(--ink)}
.examrules li:last-of-type{margin-bottom:0}
.examack{display:flex;align-items:flex-start;gap:9px;margin-top:13px;padding-top:12px;border-top:1px solid var(--warn);font-size:14px;font-weight:600;color:var(--ink);cursor:pointer}
.examack input{width:18px;height:18px;accent-color:var(--accent);flex:none;margin-top:1px}
/* Unit-page graded sub-unit picker */
.gcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 20px;margin-bottom:16px}
.gcard h2{margin:4px 0 4px;font-size:20px}
.gcard > p{color:var(--muted);margin:0 0 10px}
.gpick-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px;margin:12px 0;max-height:330px;overflow:auto;padding:2px}
.gpick-item{display:flex;align-items:center;gap:9px;padding:9px 11px;border:1px solid var(--line);border-radius:10px;cursor:pointer;font-size:14px}
.gpick-item:hover{background:var(--surface-2)}
.gpick-item.on{border-color:var(--accent);background:var(--accent-soft)}
.gpick-item input{width:17px;height:17px;accent-color:var(--accent);flex:none}
.gpick-item .code{font-weight:700;color:var(--accent);flex:none}
.gpick-item .t{color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gpick-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:4px}
.gpick-item.passed{opacity:.6;cursor:not-allowed;background:var(--surface-2)}
.gpick-item.passed .t{text-decoration:none}
.passed-badge{margin-left:auto;font-size:11px;font-weight:700;color:var(--good);background:var(--good-soft);padding:2px 8px;border-radius:999px;flex:none;white-space:nowrap}
.units-h{margin:22px 0 8px;font-size:16px}
.modes.single{grid-template-columns:1fr;max-width:460px}
.gnote{margin-top:16px;color:var(--muted)}
/* Printable marked-test report */
.report-wrap{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px 24px}
.rp-head{border-bottom:3px solid var(--accent);padding-bottom:10px;margin-bottom:14px}
.rp-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px 18px;font-size:14px;margin-bottom:16px}
.rp-grid .k{color:var(--muted)}
.rp-q{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px}
.rp-q.ok{background:var(--good-soft)}.rp-q.no{background:var(--bad-soft)}
.rp-qt{font-weight:700;margin-bottom:7px}
.rp-opt{padding:4px 8px;border-radius:7px;font-size:14px;display:flex;gap:8px;align-items:baseline}
.rp-opt .k{font-weight:700;width:18px;flex:none}
.rp-opt.chosen{outline:2px solid var(--bad);background:#fff}
.rp-opt.correct{outline:2px solid var(--good);background:#fff}
.rp-opt.chosen.correct{outline:2px solid var(--good)}
.rp-tag{font-size:12px;font-weight:700;margin-top:6px}
.rp-tag.right{color:var(--good)}.rp-tag.wrong{color:var(--bad)}
.rp-mark{display:none}/* print-only label; on screen the colors carry this meaning */
#reportOverlay{position:fixed;inset:0;background:rgba(13,23,38,.55);z-index:10000;overflow:auto;padding:28px 16px}
.ro-inner{max-width:820px;margin:0 auto;background:var(--bg);border-radius:14px;padding:20px}
/* Print rules come AFTER the overlay rules above so they win in print (media queries add no specificity) */
@page{margin:14mm}
@media print{
  html,body{background:#fff}
  header.topbar, #app, footer{display:none !important}
  /* un-trap the report from the fixed, scrolling overlay so it flows across pages */
  #reportOverlay{position:static;inset:auto;overflow:visible;background:none;padding:0;z-index:auto;display:block}
  .ro-inner{max-width:none;margin:0;background:none;border-radius:0;padding:0;overflow:visible;box-shadow:none}
  #reportPrint{position:static;left:auto;top:auto;width:100%;padding:0;overflow:visible}
  .rp-noprint{display:none !important}
  .report-wrap{border:none;border-radius:0;padding:0}
  .rp-q{break-inside:avoid}
  .ds-table thead{display:table-header-group}
  .ds-table tr{break-inside:avoid}
  /* ---- black & white: strip all color from the printout ---- */
  #reportPrint, #reportPrint h1, .rp-head, .rp-grid, .rp-grid .k, .rp-qt, .rp-opt, .rp-tag,
  .rp-tag.right, .rp-tag.wrong, .ds-table th, .ds-table td, .ds-mini{color:#000 !important}
  .rp-head{border-bottom:2px solid #000 !important}
  .rp-q{border:1px solid #000 !important;background:#fff !important}
  .rp-q.ok, .rp-q.no{background:#fff !important}
  .rp-opt{background:#fff !important}
  .rp-opt.correct, .rp-opt.chosen.correct{outline:2px solid #000 !important}  /* correct answer: solid box */
  .rp-opt.chosen{outline:2px dashed #000 !important}                           /* student's wrong pick: dashed box */
  .rp-mark{display:inline !important;margin-left:auto;padding-left:10px;font-size:12px;font-weight:700;color:#000 !important;white-space:nowrap}
  .ds-table thead th{background:#fff !important;border-bottom:2px solid #000 !important}
  .ds-pill, .ds-flag, .ds-flag.ns{background:#fff !important;color:#000 !important;border:1px solid #000 !important}
  .ds-alert, .ds-alert.warn, .ds-alert.ok{background:#fff !important;border:1px solid #000 !important;color:#000 !important}
}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:var(--display);font-weight:600;font-size:16px;letter-spacing:.01em;border-radius:9px;padding:11px 18px;border:1px solid transparent;cursor:pointer;text-decoration:none;line-height:1.1}
.btn-primary{background:var(--accent);color:var(--accent-ink)}
.btn-primary:hover{filter:brightness(1.08)}
.btn-ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn-ghost:hover{background:var(--surface-2)}
.btn-danger{background:var(--bad);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-sm{font-size:14px;padding:8px 12px}

/* hero */
.hero{position:relative;background:var(--hero-bg);color:var(--hero-ink);overflow:hidden;border-bottom:3px solid var(--hero-line)}
.hero canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.hero .wrap{position:relative;padding-block:clamp(56px,10vw,112px) clamp(48px,8vw,88px)}
.hero .status{display:flex;flex-wrap:wrap;gap:8px 18px;font-family:var(--mono);font-size:13px;color:var(--hero-muted)}
.led{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--led);box-shadow:0 0 8px var(--led);margin-right:7px;vertical-align:1px}
.led.amber{background:var(--led-amber);box-shadow:0 0 8px var(--led-amber);animation:blink 1.2s steps(2) infinite}
@keyframes blink{50%{opacity:.25}}
.hero h1{margin-top:22px;font-size:clamp(44px,9vw,104px);font-weight:700;letter-spacing:-.01em;line-height:.95;text-transform:uppercase}
.hero h1 span{display:block;color:var(--hero-line)}
.hero .sub{margin-top:18px;font-size:clamp(17px,2.2vw,21px);color:var(--hero-muted);max-width:40ch}
.hero .cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:30px}
.hero .btn-ghost{color:var(--hero-ink);border-color:#41536e}
.hero .btn-ghost:hover{background:rgba(255,255,255,.06)}
.hero .btn-primary{background:var(--hero-line);color:#04141a}

/* page sections */
.page{padding-block:32px 56px}
.pagehead{display:flex;flex-direction:column;gap:8px;margin-bottom:24px}
.pagehead h1{font-size:clamp(30px,4.6vw,44px);font-weight:700}
.pagehead p{color:var(--muted);max-width:68ch}
.crumbs{font-size:14px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px}
.crumbs a{color:var(--muted)}
.section-title{font-size:22px;font-weight:600;margin:36px 0 14px}

.home-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;margin-top:8px}
.tile{display:flex;flex-direction:column;gap:8px;padding:20px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);text-decoration:none;color:var(--ink);min-width:0}
.tile:hover{border-color:var(--accent)}
.tile h3{font-size:20px}
.tile p{color:var(--muted);font-size:15px}
.tile .go{margin-top:auto;font-family:var(--display);font-weight:600;color:var(--accent)}

/* unit list */
.units{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.unit-row{display:grid;grid-template-columns:64px 1fr auto;gap:16px;align-items:center;padding:18px 20px;text-decoration:none;color:var(--ink);border-top:1px solid var(--line)}
.unit-row:first-child{border-top:0}
.unit-row:hover{background:var(--surface-2)}
.unit-num{font-family:var(--display);font-weight:700;font-size:30px;color:var(--accent)}
.unit-row h3{font-size:19px}

.subs{list-style:none;margin:0;padding:0}
.subs a{display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:baseline;padding:10px 18px;text-decoration:none;color:var(--ink);border-top:1px solid var(--line)}

.mode h2{font-size:21px}
.mode p{color:var(--muted);font-size:15px}
.mode ul{margin:0;padding-left:18px;color:var(--muted);font-size:15px}
.mode .btn{align-self:flex-start;margin-top:auto}
.notice{padding:14px 16px;border-radius:9px;background:var(--warn-soft);color:var(--ink);border:1px solid var(--warn);font-size:15px}
.notice.ok{background:var(--good-soft);border-color:var(--good)}
.notice.err{background:var(--bad-soft);border-color:var(--bad)}

.form{max-width:520px;display:flex;flex-direction:column;gap:16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:24px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:700}
.field input{font:inherit;padding:11px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.field input:focus{outline:2px solid var(--accent);border-color:var(--accent)}
.field .err{color:var(--bad);font-size:14px;min-height:1.2em}
.row{display:flex;flex-wrap:wrap;gap:10px}

.timer{font-family:var(--mono);font-weight:600;font-size:18px;padding:6px 12px;border-radius:8px;background:var(--surface);border:1px solid var(--line);font-variant-numeric:tabular-nums}
.timer.low{color:var(--warn);border-color:var(--warn);background:var(--warn-soft)}

.qcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:clamp(18px,3vw,28px)}

.qtext{font-size:clamp(18px,2.2vw,21px);margin-top:10px;line-height:1.45}

.opt[aria-checked="true"] .k{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.qnav{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px;align-items:center}
.qnav .spacer{flex:1}
.flag-on{color:var(--warn);border-color:var(--warn)}
.side{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.side h3{font-size:15px;font-family:var(--body);font-weight:700;margin-bottom:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(36px,1fr));gap:6px}
.grid button{font-family:var(--mono);font-size:12px;height:34px;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--muted);cursor:pointer;position:relative}

.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--muted);margin-top:10px}
.side .btn{width:100%;margin-top:14px}

.card a.more{margin-top:auto;font-family:var(--display);font-weight:600}

td.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.note{font-size:14px;color:var(--muted);margin-top:10px}

footer{border-top:1px solid var(--line);padding-block:22px;color:var(--muted);font-size:14px}
body.exam-mode footer{display:none}
.loading{color:var(--muted);padding:40px 0}

}

let INDEX = null;
const bankCache = {};
async function loadIndex(){
  if (INDEX) return INDEX;
  try { const r = await fetch("data/index.json", {cache:"no-cache"}); INDEX = r.ok ? await r.json() : {}; }
  catch(e){ INDEX = {}; }
  return INDEX;
}
async function loadBank(id){
  if (bankCache[id]) return bankCache[id];
  const r = await fetch("data/" + id + ".json");
  if (!r.ok) throw new Error("bank " + id);
  const rows = await r.json();
  bankCache[id] = rows.map(row => ({raw:row, src:id}));
  return bankCache[id];
}
function makeQuestion(item){
  const opts = item.raw.slice(1).map((t,i) => ({t, ok:i===0}));
  shuffle(opts);
  return {q:item.raw[0], opts:opts.map(o=>o.t), ans:opts.findIndex(o=>o.ok), src:item.src};
}
async function pickQuestions(ids, n){
  const idx = await loadIndex();
  const avail = ids.filter(id => idx[id]);
  const banks = await Promise.all(avail.map(loadBank));
  const seen = new Set(), pool = [];
  banks.flat().forEach(it => { if (!seen.has(it.raw[0])) { seen.add(it.raw[0]); pool.push(it); } });
  return shuffle(pool).slice(0, n).map(makeQuestion);
}
/* Draw n questions spread as evenly as possible across several banks (for combined graded tests) */
async function pickBalanced(ids, n){
  const idx = await loadIndex();
  const avail = ids.filter(id => idx[id]);
  if (avail.length <= 1) return pickQuestions(ids, n);
  const banks = await Promise.all(avail.map(loadBank));
  const per = Math.floor(n / avail.length);
  const seen = new Set(), chosen = [], leftover = [];
  banks.forEach(bank => {
    let takenFromBank = 0;
    shuffle(bank).forEach(it => {
      if (seen.has(it.raw[0])) return;
      seen.add(it.raw[0]);
      if (takenFromBank < per) { chosen.push(it); takenFromBank++; } else { leftover.push(it); }
    });
  });
  const need = Math.max(0, n - chosen.length);
  const final = chosen.concat(shuffle(leftover).slice(0, need));
  return shuffle(final).slice(0, n).map(makeQuestion);
}

let _jsonpN = 0;
function api(action, params){
  return new Promise(resolve => {
    if (!CONFIG.apiEndpoint){ resolve({ok:false, error:"notset"}); return; }
    const cb = "__cb" + (_jsonpN++);
    const s = document.createElement("script");
    const done = (data) => { clearTimeout(t); try { delete window[cb]; } catch(e){} if (s.parentNode) s.parentNode.removeChild(s); resolve(data); };
    const t = setTimeout(() => done({ok:false, error:"timeout"}), 15000);
    window[cb] = done;
    s.onerror = () => done({ok:false, error:"network"});
    const q = Object.assign({action, callback:cb}, params || {});
    s.src = CONFIG.apiEndpoint + (CONFIG.apiEndpoint.indexOf("?") >= 0 ? "&" : "?") +
      Object.keys(q).map(k => encodeURIComponent(k) + "=" + encodeURIComponent(q[k] == null ? "" : q[k])).join("&");
    document.head.appendChild(s);
  });
}

async function saveToBackend(z){

  let unit = "", subunit = "";
  if (z.kind === "graded"){
    const subs = z.subunits || (z.ids ? z.ids.slice() : []);
    subunit = subs.join("+");
    unit = String(subs[0] || "").split(".")[0];
  } else if (z.kind === "unit"){ unit = String(z.lock || "").replace("unit-", ""); }
  const attemptId = "A" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  const r = await api("saveAttempt", {
    token: s.token, attemptId, kind: z.kind, unit: unit, subunit: subunit, title: z.title,
    correct: z.correct, total: z.total, percent: z.percent, passed: z.passed,
    passMark: z.passMark, durationSec: Math.round((z.finishedAt - z.startedAt) / 1000)
  });
  // Send the marked detail (question-by-question) for the instructor's PDF report — fire-and-forget POST
  if (r.ok){

    } catch(e){}
  }
  return r.ok ? "saved" : (r.error === "notset" ? "notset" : "failed");
}

/* ---------- activity heartbeat (time on site) ---------- */
(function(){
  const IDLE_MS = 90000;            // stop counting after 90s with no interaction
  let last = Date.now(), lastAct = Date.now(), accMs = 0;
  function accumulate(){
    const now = Date.now();
    if (!document.hidden && (now - lastAct) < IDLE_MS) accMs += now - last;
    last = now;
  }
  function flush(){
    accumulate();
    const s = Student.get(); const secs = Math.round(accMs / 1000);
    if (s && CONFIG.apiEndpoint && secs >= 5){ accMs = 0; api("heartbeat", {token:s.token, seconds:Math.min(180, secs)}); }
  }
  ["mousemove","keydown","click","scroll","touchstart"].forEach(ev => window.addEventListener(ev, () => { lastAct = Date.now(); }, {passive:true}));
  document.addEventListener("visibilitychange", () => { accumulate(); if (document.hidden) flush(); else last = Date.now(); });
  window.addEventListener("pagehide", flush);
  setInterval(accumulate, 15000);
  setInterval(flush, 60000);
})();

async function openAttemptReport(attemptId){
  const it = Instr.get(); if (!it) return;
  let ov = document.getElementById("reportOverlay"); if (ov) ov.remove();
  ov = document.createElement("div"); ov.id = "reportOverlay";
  ov.innerHTML = `<div class="ro-inner"><div id="reportPrint"><p class="ds-mini">Loading report…</p></div></div>`;
  document.body.appendChild(ov);
  ov.onclick = (e) => { if (e.target === ov) ov.remove(); };
  const r = await api("attemptReport", {token: it.token, attemptId});
  const host = document.getElementById("reportPrint");
  if (!r.ok || !r.summary){ host.innerHTML = `<div class="report-wrap"><p>Could not load this report.</p></div><div class="rp-noprint" style="text-align:right;margin-top:12px"><button class="btn btn-ghost" id="roClose">Close</button></div>`;
    document.getElementById("roClose").onclick = () => ov.remove(); return; }
  const s = r.summary, when = s.ts ? new Date(s.ts).toLocaleString() : "";
  const qhtml = (r.items||[]).map(q => {
    const opts = (q.options||[]).map((o,i) => {
      const isC = q.correct===i, isX = q.chosen===i;
      const cls = (isX ? " chosen" : "") + (isC ? " correct" : "");
      const mk = (isC && isX) ? "✓ correct — student's answer" : isC ? "✓ correct answer" : isX ? "✗ student's answer" : "";
      const mark = mk ? `<span class="rp-mark">${mk}</span>` : "";
      return `<div class="rp-opt${cls}"><span class="k">${LETTERS[i]}</span><span>${esc(o)}</span>${mark}</div>`;
    }).join("");
    const tag = q.ok ? `<div class="rp-tag right">✓ Correct</div>` : `<div class="rp-tag wrong">✗ Incorrect${q.chosen==null ? " — no answer" : ""}</div>`;
    return `<div class="rp-q ${q.ok?'ok':'no'}"><div class="rp-qt">${q.n}. ${esc(q.q)}</div>${opts}${tag}</div>`;
  }).join("");
  host.innerHTML = `
    <div class="report-wrap">
      <div class="rp-head"><div class="ds-mini">CTT · Computer Technology Trade — Graded Test Report</div>
        <h1 style="margin:4px 0 2px;font-size:24px">${esc(r.name || s.studentId)}</h1>
        <div class="ds-mini">${esc(s.title || '')}</div></div>
      <div class="rp-grid">
        <div><span class="k">Student ID:</span> ${esc(s.studentId)}</div>
        <div><span class="k">Grade:</span> <b>${s.percent}% · ${s.passed ? 'PASSED' : 'NOT PASSED'}</b></div>
        <div><span class="k">Score:</span> ${s.correct} of ${s.total} correct</div>
        <div><span class="k">Pass mark:</span> ${s.passMark}%</div>
        <div><span class="k">Completed:</span> ${esc(when)}</div>
        <div><span class="k">Sub-unit(s):</span> ${esc(String(s.subunit||'').replace(/\+/g,' + '))}</div>
      </div>
      ${qhtml || '<p class="ds-mini">Question-by-question detail was not stored for this attempt.</p>'}
    </div>
    <div class="rp-noprint" style="display:flex;gap:10px;margin-top:14px;justify-content:flex-end">
      <button class="btn btn-ghost" id="roClose">Close</button>
      <button class="btn btn-primary" id="roPrint">Print / Save as PDF</button>
    </div>`;
  document.getElementById("roClose").onclick = () => ov.remove();
  document.getElementById("roPrint").onclick = () => window.print();
}

/* ---------- instructor: class export + printable report ---------- */
const ST_TEXT = {below:"Below pass line", ontrack:"On track", notstarted:"Not started"};
function csvCell(v){ v = String(v==null?"":v); return /[",\n\r]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v; }
function dsExportCsv(studs){
  const head = ["Student Name","Student ID","Status","Graded Avg %","Graded Attempts","Sub-units Passed","Sub-units Total","Unit 1","Unit 2","Unit 3","Unit 4","Unit 5","Time This Week (min)"];
  const lines = [head.map(csvCell).join(",")];
  studs.forEach(s => { const st = statusOf(s); const uv = {}; (s.units||[]).forEach(u => uv[u.unit] = u.subPassed+"/"+u.subTotal);
    lines.push([s.name||s.id, s.id, ST_TEXT[st], (s.gradedAttempts>0?s.avgGraded:""), s.gradedAttempts||0, s.subPassed, s.subTotal,
      uv[1]||"0/0", uv[2]||"0/0", uv[3]||"0/0", uv[4]||"0/0", uv[5]||"0/0", s.weekMinutes||0].map(csvCell).join(","));
  });
  const stamp = new Date().toISOString().slice(0,10);
  const blob = new Blob(["﻿"+lines.join("\r\n")], {type:"text/csv;charset=utf-8"});
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
  a.download = "CTT_Class_Progress_"+stamp+".csv"; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}
function printClassReport(studs, meta){
  let ov = document.getElementById("reportOverlay"); if (ov) ov.remove();
  ov = document.createElement("div"); ov.id = "reportOverlay";
  ov.innerHTML = `<div class="ro-inner"><div id="reportPrint"></div></div>`;
  document.body.appendChild(ov);
  ov.onclick = (e) => { if (e.target === ov) ov.remove(); };
  const when = new Date().toLocaleString();
  const rows = studs.map(s => { const st = statusOf(s);
    return `<tr><td>${esc(s.name||s.id)}<div class="ds-id">${esc(s.id)}</div></td>
      <td>${st==="below"?"⚠ ":""}${ST_TEXT[st]}</td>
      <td style="text-align:center">${s.gradedAttempts>0?s.avgGraded+"%":"—"}</td>
      <td style="text-align:center">${s.subPassed}/${s.subTotal}</td>
      <td style="text-align:center">${fmtMin(s.weekMinutes)}</td></tr>`; }).join("");
  document.getElementById("reportPrint").innerHTML = `
    <div class="report-wrap">
      <div class="rp-head"><div class="ds-mini">CTT · Computer Technology Trade — Class Progress Report</div>
        <h1 style="margin:4px 0 2px;font-size:24px">Class Progress</h1>

        <tbody>${rows || '<tr><td colspan="5" class="ds-mini">No students yet.</td></tr>'}</tbody></table>

/* ---------- quiz engine ---------- */
function stopQuiz(){
  if (quiz && quiz.timerId) clearInterval(quiz.timerId);
  document.body.classList.remove("exam-mode");
  document.body.classList.remove("practice-mode");
  window.onbeforeunload = null;
  quiz = null;
}
function beginQuiz(cfg){
  quiz = {...cfg, answers:new Array(cfg.qs.length).fill(null), flags:new Set(), cur:0, state:"running", confirm:null, startedAt:Date.now(), filter:"all"};
  if (cfg.kind !== "practice") { document.body.classList.add("exam-mode"); window.onbeforeunload = () => true; }
  else { document.body.classList.add("practice-mode"); }
  if (cfg.minutes) {
    quiz.endsAt = Date.now() + cfg.minutes*60000;
    quiz.timerId = setInterval(tick, 1000);
  }
  window.scrollTo(0,0);
  renderQuiz();
}
function tick(){
  if (!quiz || quiz.state !== "running") return;
  const left = (quiz.endsAt - Date.now())/1000;
  const el = document.getElementById("timer");
  if (el) { el.textContent = fmtTime(left); el.classList.toggle("low", left <= 300); }
  if (left <= 0) { quiz.timedOut = true; finishQuiz(); }
}
function renderQuiz(){
  const z = quiz, q = z.qs[z.cur], total = z.qs.length;
  const answered = z.answers.filter(a=>a!==null).length;
  const isExam = z.kind !== "practice";
  $app.innerHTML = `
  <section class="wrap page" style="padding-top:8px">
    <div class="qbar"><span class="title">${esc(z.title)}</span><span class="count">${answered}/${total} answered</span>
      ${z.minutes ? `<span class="timer" id="timer" role="timer" aria-label="Time remaining">${fmtTime((z.endsAt-Date.now())/1000)}</span>` : ""}</div>
    <div class="quiz-layout">
      <div>
        <div class="qcard">
          <div class="qnum"><span>Question ${z.cur+1} of ${total}</span>${z.flags.has(z.cur) ? `<span class="pill" style="color:var(--warn);border-color:var(--warn)">Flagged</span>`:""}</div>
          <p class="qtext" id="qtext">${esc(q.q)}</p>
          <div class="opts" role="radiogroup" aria-labelledby="qtext">
            ${q.opts.map((o,i)=>`<button class="opt" role="radio" aria-checked="${z.answers[z.cur]===i}" data-i="${i}"><span class="k">${LETTERS[i]}</span><span>${esc(o)}</span></button>`).join("")}
          </div>
          <div class="qnav">
            <button class="btn btn-ghost btn-sm" id="prev" ${z.cur===0?"disabled":""}>← Previous</button>
            <button class="btn btn-ghost btn-sm ${z.flags.has(z.cur)?"flag-on":""}" id="flag">${z.flags.has(z.cur)?"Unflag":"Flag for review"}</button>
            <span class="spacer"></span>
            ${z.cur < total-1 ? `<button class="btn btn-primary btn-sm" id="next">Next →</button>` : `<button class="btn btn-primary btn-sm" id="submit2">${isExam ? "Submit and grade" : "Finish and grade"}</button>`}
          </div>
        </div>
        ${z.confirm === "submit" ? `<div class="confirm" role="alertdialog" aria-labelledby="cft"><p id="cft"><b>Submit and grade now?</b> ${total-answered ? `You have ${total-answered} unanswered question${total-answered>1?"s":""}. Unanswered questions are marked incorrect.` : "All questions are answered."}</p>
          <div class="row"><button class="btn btn-primary" id="doSubmit">Submit and grade</button><button class="btn btn-ghost" id="keep">Keep working</button></div></div>` : ""}
        ${z.confirm === "cancel" ? `<div class="confirm danger" role="alertdialog" aria-labelledby="cfc"><p id="cfc"><b>${isExam ? "Cancel this exam?" : "Quit this practice set?"}</b> Your answers will not be graded${isExam ? " or sent" : ""}.</p>
          <div class="row"><button class="btn btn-danger" id="doCancel">${isExam ? "Cancel exam" : "Quit"}</button><button class="btn btn-ghost" id="keep">Keep working</button></div></div>` : ""}
      </div>
      <aside class="side" aria-label="Question navigator">
        <h3>Questions</h3>
        <div class="grid">${z.qs.map((_,i)=>`<button data-go="${i}" class="${z.answers[i]!==null?"ans":""} ${i===z.cur?"cur":""} ${z.flags.has(i)?"flg":""}" aria-label="Question ${i+1}${z.answers[i]!==null?", answered":""}${z.flags.has(i)?", flagged":""}">${i+1}</button>`).join("")}</div>
        <div class="legend"><span>■ answered</span><span style="color:var(--warn)">● flagged</span></div>
        <button class="btn btn-primary btn-sm" id="submit">${isExam ? "Submit and grade" : "Finish and grade"}</button>
        <button class="btn btn-ghost btn-sm" id="cancel">${isExam ? "Cancel exam" : "Quit practice"}</button>
      </aside>
    </div>
  </section>`;
  $app.querySelectorAll(".opt").forEach(b => b.onclick = () => { z.answers[z.cur] = +b.dataset.i; renderQuiz(); });
  $app.querySelectorAll("[data-go]").forEach(b => b.onclick = () => { z.cur = +b.dataset.go; z.confirm=null; renderQuiz(); });
  const on = (id, fn) => { const el = document.getElementById(id); if (el) el.onclick = fn; };
  on("prev", () => { z.cur--; z.confirm=null; renderQuiz(); });
  on("next", () => { z.cur++; z.confirm=null; renderQuiz(); });
  on("flag", () => { z.flags.has(z.cur) ? z.flags.delete(z.cur) : z.flags.add(z.cur); renderQuiz(); });
  on("submit", () => { z.confirm="submit"; renderQuiz(); document.getElementById("doSubmit")?.focus(); });
  on("submit2", () => { z.confirm="submit"; renderQuiz(); document.getElementById("doSubmit")?.focus(); });
  on("cancel", () => { z.confirm="cancel"; renderQuiz(); document.getElementById("doCancel")?.focus(); });
  on("keep", () => { z.confirm=null; renderQuiz(); });
  on("doSubmit", finishQuiz);
  on("doCancel", () => { const back = z.back; stopQuiz(); if (location.hash === back) route(); else location.hash = back; });
}
document.addEventListener("keydown", e => {
  if (!quiz || quiz.state !== "running" || e.target.matches("input,textarea") || e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key.toUpperCase(), i = LETTERS.indexOf(k);
  if (i >= 0 && i < quiz.qs[quiz.cur].opts.length) { quiz.answers[quiz.cur] = i; renderQuiz(); }
  else if (e.key === "ArrowRight" && quiz.cur < quiz.qs.length-1) { quiz.cur++; quiz.confirm=null; renderQuiz(); }
  else if (e.key === "ArrowLeft" && quiz.cur > 0) { quiz.cur--; quiz.confirm=null; renderQuiz(); }
});

function finishQuiz(){
  const z = quiz; if (!z || z.state !== "running") return;
  if (z.timerId) clearInterval(z.timerId);
  window.onbeforeunload = null;
  z.state = "results";
  z.finishedAt = Date.now();
  z.items = z.qs.map((q,i) => ({n:i+1, q:q.q, chosen: z.answers[i]===null ? "" : q.opts[z.answers[i]], correct:q.opts[q.ans], ok: z.answers[i]===q.ans, src:q.src}));
  z.correct = z.items.filter(x=>x.ok).length;
  z.total = z.items.length;
  z.percent = Math.round(z.correct / z.total * 1000) / 10;
  z.passMark = passMarkFor(z.kind);
  z.passed = z.correct / z.total >= z.passMark/100;
  z.sendStatus = z.kind === "practice" ? null : "sending";
  renderResults();
  if (z.kind !== "practice"){
    const saver = (Student.get() && CONFIG.apiEndpoint) ? saveToBackend(z) : sendResults(z);
    Promise.resolve(saver).then(st => { if (quiz === z){ z.sendStatus = st; renderSendStatus(); } });
  }
}
async function sendResults(z){
  if (!CONFIG.endpoint) return "notset";
  const payload = {
    type: z.kind, title: z.title, name: z.name, email: z.email,
    correct: z.correct, total: z.total, percent: z.percent, passed: z.passed, passMark: z.passMark,
    timedOut: !!z.timedOut, started: new Date(z.startedAt).toISOString(), finished: new Date(z.finishedAt).toISOString(),
    durationSec: Math.round((z.finishedAt - z.startedAt)/1000),
    timeZone: Intl.DateTimeFormat().resolvedOptions().timeZone
  };
  if (z.kind === "graded") payload.items = z.items.map(({n,q,chosen,correct,ok}) => ({n,q,chosen,correct,ok}));
  try {
    await fetch(CONFIG.endpoint, {method:"POST", mode:"no-cors", headers:{"Content-Type":"text/plain;charset=utf-8"}, body:JSON.stringify(payload)});
    return "sent";
  } catch(e) { return "failed"; }
}
function renderSendStatus(){
  const el = document.getElementById("sendStatus"); if (!el || !quiz) return;
  const map = {
    sending: ["", "Recording your results…"],
    saved: ["ok", "Your results were saved to your progress."],
    sent: ["ok", "Your results were sent to your instructor."],
    notset: ["err", "Your results could not be sent because the site's email connection is not set up yet. Show this screen to your instructor."],
    failed: ["err", "Your results could not be sent. Check your internet connection and tell your instructor before leaving this page."]
  };
  const [cls, msg] = map[quiz.sendStatus];
  el.className = "notice " + cls; el.textContent = msg;
}
function renderResults(){
  const z = quiz, C = 2*Math.PI*58, dash = C * z.correct / z.total;
  const showItems = z.items.filter(x => z.filter==="all" || (z.filter==="wrong" ? !x.ok : x.ok));
  const wrongCount = z.total - z.correct;
  $app.innerHTML = `
  <section class="wrap page">
    <div class="pagehead"><span class="eyebrow">Results</span><h1>${esc(z.title)}</h1>${z.name ? `<p>${esc(z.name)} · ${esc(z.email)}</p>`:""}</div>
    ${(z.passed && z.kind!=="practice") ? `<div class="celebrate" role="status"><div class="celebrate-emoji">🎉</div><div><div class="celebrate-title">Congratulations${z.name ? ", "+esc(z.name.split(" ")[0]) : ""}!</div><div class="celebrate-sub">You passed with ${z.percent}% — your results are on the way to your instructor.</div></div></div>` : ""}
    ${z.timedOut ? `<div class="notice" style="margin-bottom:16px">Time is up. Your exam was submitted automatically.</div>` : ""}
    <div class="score">
      <div class="ring"><svg viewBox="0 0 140 140" aria-hidden="true"><circle cx="70" cy="70" r="58" fill="none" stroke="var(--line)" stroke-width="12"/><circle cx="70" cy="70" r="58" fill="none" stroke="${z.passed?"var(--good)":"var(--bad)"}" stroke-width="12" stroke-linecap="round" stroke-dasharray="${dash} ${C}"/></svg><span class="pct">${z.percent}%</span></div>
      <div><span class="verdict ${z.passed?"pass":"fail"}">${z.passed ? "Passed" : "Not passed"}</span>
        <div class="stats"><span>Correct <b>${z.correct}</b></span><span>Incorrect <b>${wrongCount}</b></span><span>Total <b>${z.total}</b></span><span>Pass mark <b>${z.passMark}%</b></span><span>Time <b>${fmtTime((z.finishedAt-z.startedAt)/1000)}</b></span></div>
        ${z.sendStatus ? `<div id="sendStatus" class="notice" style="margin-top:14px" role="status"></div>` : ""}
        <div class="row" style="margin-top:16px"><a class="btn btn-primary" href="${z.back}" id="backBtn">Back</a>${z.kind==="practice" ? `<button class="btn btn-ghost" id="again">New practice set</button>`:""}</div>
      </div>
    </div>
    <div class="filters" role="group" aria-label="Filter review">
      <button class="btn btn-ghost btn-sm" data-f="all" aria-pressed="${z.filter==="all"}">All (${z.total})</button>
      <button class="btn btn-ghost btn-sm" data-f="wrong" aria-pressed="${z.filter==="wrong"}">Incorrect (${wrongCount})</button>
      <button class="btn btn-ghost btn-sm" data-f="right" aria-pressed="${z.filter==="right"}">Correct (${z.correct})</button>
    </div>
    <ol class="review">
      ${showItems.map(x => `<li><span class="mark ${x.ok?"ok":"no"}" aria-label="${x.ok?"Correct":"Incorrect"}">${x.ok?"✓":"✗"}</span>
        <div><p class="q">${x.n}. ${esc(x.q)}</p>
          <p class="a">Your answer: ${x.chosen ? `<span class="${x.ok?"right":"wrong"}">${esc(x.chosen)}</span>` : `<span class="wrong">No answer</span>`}</p>
          ${x.ok ? "" : `<p class="a">Correct answer: <span class="right">${esc(x.correct)}</span></p>`}</div></li>`).join("") || `<li><span></span><p>Nothing to show.</p></li>`}
    </ol>
  </section>`;
  renderSendStatus();
  document.body.classList.remove("exam-mode");
  document.body.classList.remove("practice-mode");
  if (z.passed && z.kind !== "practice" && !z.celebrated){ z.celebrated = true; celebrate(); }
  $app.querySelectorAll("[data-f]").forEach(b => b.onclick = () => { z.filter = b.dataset.f; renderResults(); });
  document.getElementById("backBtn").onclick = e => { e.preventDefault(); const back = z.back; stopQuiz(); if (location.hash === back) route(); else location.hash = back; };
  const again = document.getElementById("again");
  if (again) again.onclick = () => { const id = fromHash(z.back.slice(1)); stopQuiz(); pickQuestions([id], SIZES.subunit).then(qs => beginQuiz({kind:"practice", title:z.title, qs, back:z.back})); };
  window.scrollTo(0,0);
}

/* ---------- congratulations confetti ---------- */
function celebrate(){
  if (window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  let c = document.getElementById("confetti");
  if (!c){ c = document.createElement("canvas"); c.id = "confetti"; document.body.appendChild(c); }
  const ctx = c.getContext("2d"), DPR = Math.min(2, window.devicePixelRatio || 1);
  c.width = innerWidth * DPR; c.height = innerHeight * DPR;
  const colors = ["#0a7387","#17804a","#ffcf33","#ff6b6b","#5b8def","#ff9f1c"], parts = [];
  for (let i=0;i<150;i++) parts.push({
    x: Math.random()*c.width, y: -20*DPR - Math.random()*c.height*0.3,
    r: (6+Math.random()*7)*DPR, color: colors[i%colors.length],
    vx: (-1+Math.random()*2)*DPR*2, vy: (3+Math.random()*4)*DPR,
    rot: Math.random()*6.28, vr: -0.2+Math.random()*0.4, shape: Math.random()<0.5?0:1 });
  const start = performance.now(), dur = 3200;
  (function frame(t){
    const el = t - start; ctx.clearRect(0,0,c.width,c.height);
    for (const p of parts){ p.vy += 0.05*DPR; p.x += p.vx; p.y += p.vy; p.rot += p.vr;
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot); ctx.fillStyle = p.color;
      if (p.shape===0) ctx.fillRect(-p.r/2,-p.r/2,p.r,p.r*0.6);
      else { ctx.beginPath(); ctx.arc(0,0,p.r/2,0,6.28); ctx.fill(); }
      ctx.restore(); }
    if (el < dur) requestAnimationFrame(frame);
    else { ctx.clearRect(0,0,c.width,c.height); if (c.parentNode) c.parentNode.removeChild(c); }
  })(start);
}

/* ---------- splash network animation ---------- */
let netRAF = null;
function startNetCanvas(){
  cancelAnimationFrame(netRAF);
  const cv = document.getElementById("net"); if (!cv) return;
  const ctx = cv.getContext("2d");
  const css = getComputedStyle(document.documentElement);
  const lineCol = css.getPropertyValue("--hero-line").trim() || "#3cc4d8";
  const ledCol = css.getPropertyValue("--led").trim() || "#36d47c";
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let W, H, nodes = [], packets = [];
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  function size(){
    const r = cv.getBoundingClientRect(); W = r.width; H = r.height;
    cv.width = W*dpr; cv.height = H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
    const count = Math.min(70, Math.max(24, Math.round(W*H/16000)));
    nodes = Array.from({length:count}, () => ({x:Math.random()*W, y:Math.random()*H, vx:(Math.random()-.5)*.25, vy:(Math.random()-.5)*.25, r:Math.random()<.18?3.2:1.8}));
  }
  size();
  const LINK = 150;
  function frame(){
    if (!document.getElementById("net")) return;
    ctx.clearRect(0,0,W,H);
    for (const n of nodes){ if(!reduce){ n.x+=n.vx; n.y+=n.vy; if(n.x<0||n.x>W) n.vx*=-1; if(n.y<0||n.y>H) n.vy*=-1; } }
    ctx.lineWidth = 1;
    const edges = [];
    for (let i=0;i<nodes.length;i++) for (let j=i+1;j<nodes.length;j++){
      const a=nodes[i], b=nodes[j], d=Math.hypot(a.x-b.x,a.y-b.y);
      if (d<LINK){ edges.push([a,b]); ctx.globalAlpha = (1-d/LINK)*.35; ctx.strokeStyle = lineCol; ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke(); }
    }
    ctx.globalAlpha = .9;
    for (const n of nodes){ ctx.fillStyle = n.r>3 ? lineCol : "#7f93ad"; ctx.beginPath(); ctx.arc(n.x,n.y,n.r,0,Math.PI*2); ctx.fill(); }
    if (!reduce){
      if (packets.length < 14 && edges.length && Math.random() < .12){ const e = edges[Math.floor(Math.random()*edges.length)]; packets.push({a:e[0], b:e[1], t:0, s:.008+Math.random()*.012}); }
      packets = packets.filter(p => (p.t += p.s) < 1);
      ctx.fillStyle = ledCol; ctx.globalAlpha = 1;
      for (const p of packets){ const x=p.a.x+(p.b.x-p.a.x)*p.t, y=p.a.y+(p.b.y-p.a.y)*p.t; ctx.beginPath(); ctx.arc(x,y,2.4,0,Math.PI*2); ctx.fill(); }
    }
    ctx.globalAlpha = 1;
    if (!reduce) netRAF = requestAnimationFrame(frame);
  }
  frame();
  window.onresize = () => { if (document.getElementById("net")) { size(); if (reduce) frame(); } };
}

route();
</script>
